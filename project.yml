name: Pomidor
options:
  bundleIdPrefix: com.pomidor
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  Pomidor:
    type: application
    platform: macOS
    sources:
      - path: Pomidor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomidor.app
        INFOPLIST_FILE: Pomidor/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
